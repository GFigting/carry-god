id: 2026-09-29-project-submit-test-scope
status: done
goal: 将原项目测试删除规则改为所有原项目提交的强制门禁，并明确测试文件识别边界。
workflow: framework:framework-optimization
created_at: 2026-09-29T00:00:00+08:00
next_action: 任务已关闭。
requirements_reference: ../../requirements-inbox/2026-09-29-project-submit-test-scope.md
requirements_reference_note: 需求包在提交策略统一前未随框架提交，本机已不可恢复；保留引用路径作为溯源。
scope_decision:
  mode: independent
  rationale: 优化既有提交门禁的触发条件和测试文件边界，验收标准独立于已完成的初始规则任务。
decisions:
  - id: every-project-submit
    decision: 任意原项目业务仓库提交均触发测试删除门禁，不要求用户说“提交全部内容”。
    rationale: 消除现有规则的触发条件歧义。
  - id: test-file-boundary
    decision: 测试目录及其内容、常见 .test./.spec. 文件、夹具、快照、模拟数据和测试配置均属于测试文件范围。
    rationale: 覆盖不同项目的常见测试组织方式。
  - id: framework-exclusion
    decision: cg-work 框架自身测试继续保留，不适用原项目删除门禁。
    rationale: 延续已确认的项目范围边界。
