lightweight_evidence:
  root_cause: 时间字段规则只写在 core/operating-model.md 与脚本约定中，check-all.mjs 对任务记录仅做 YAML 可解析校验，没有时间字段检查；AI 直接写 task.yaml 绕过 task-stamp 填入 T00:00:00 占位时 npm run check 一路放行（fms 2026-10-20-finished-inventory-export 事发后全仓扫描发现 21 个活跃任务占位）。
  scope: 新增 scripts/task-time-fields.mjs（created_at/status_history.at 占位、时区后缀、at 纯日期与空值校验，用 JSON_SCHEMA 解析保留原始时间字符串）并在 check-all.mjs 接入，覆盖所有项目的活跃任务、跳过 tasks/archive 与解析失败的文件；task-stamp 的 fix-placeholders 扩展识别 created_at 占位并退化为纯日期，输出同步展示两类占位；批量修复 17 个可解析活跃任务的 created_at 存量；同步 core/operating-model.md 与 scripts/README.md，VERSION 2.29.0 -> 2.30.0。
  verification: fix-placeholders 预览的 17 条与 npm run check 报出的错误完全一致，--apply 后 npm run check 全绿；npm test 49/49 通过，新增 test/task-time-fields.test.mjs 覆盖 created_at 占位/时区后缀/at 纯日期/合法值接受/归档豁免/解析失败不阻塞六类场景。
  review: 关键点是校验必须用 JSON_SCHEMA：js-yaml 默认 schema 会把未加引号的时间解析成 Date，占位与时区信息会丢失导致校验形同虚设。21 个活跃占位中 17 个可解析已修复，其余 4 个（lasen 3、job-hunt 1）task.yaml 历史 YAML 损坏无法解析，本次不纳入校验范围，作为遗留单独告知用户；业务项目记录为本机数据不入库，批量改写不可回滚，已由用户在优化方向中明确批准。
  integration_decision: 框架自身变更与业务项目记录修复，随 cg-work 本地提交收口，不推送。
