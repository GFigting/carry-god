# 项目身份与主仓库位置。
project:
  # 稳定标识，使用小写 kebab-case，并与上下文目录名一致。
  id: example-project
  # 项目显示名称。
  name: 示例项目
  # 项目所属业务领域。
  domain: 业务领域
  # 必须是绝对路径；只有框架受管项目 cg-work 可以用字面量 . 表示框架目录自身。
  root_path: D:/path/to/project
# 可选的附属仓库；主仓库由 project.root_path 指定。
repositories: []
# 稳定文档的分类入口；每项声明 path 和 load，load 可取 always 或 when_relevant。
documentation:
  # 项目协作、仓库和贡献规则。
  project_rules:
    - path: D:/path/to/project/AGENTS.md
      load: always
  # 项目专属编码、测试和工程规范。
  development_standards:
    - path: D:/path/to/project/docs/development-standards.md
      load: always
  # 业务规则、流程和领域说明。
  business: []
  # 系统结构、模块边界和架构决策索引。
  architecture: []
  # API、事件和消息契约。
  api: []
  # 数据模型、字典、约束和迁移规则。
  data: []
  # 启动、部署、监控和故障处理说明。
  operations: []
  # 认证授权、敏感数据和审计规则。
  security: []
# 技术栈与包管理器。
technology:
  # 主要语言、运行时和框架。
  stack: []
  # 包管理器名称；没有时为 null。
  package_manager: null
# 运行入口和可访问的健康检查地址。
runtime:
  # 可执行入口文件或启动命令。
  entrypoints: []
  # 健康检查 URL 或检查命令。
  health_checks: []
# 可选的 SQL 脚本目录；数据库规则文档仍登记在 documentation.data。
database:
  # 项目维护的 SQL 变更、初始化或修复脚本目录；无独立目录时为空。
  sql_paths: []
# 按需读取的本地工具配置；配置内容不得包含提交到仓库的真实凭据。
tooling:
  # MCP 或其他开发工具配置文件路径。
  config_paths: []
# 验证配置；每个 profile 定义一种可执行检查。
verification:
  # 每项包含 id、stage、command、outcome 和环境限制 limitation。
  profiles: []
# 框架本地的原始需求入口。
requirements:
  # 该项目 requirements-inbox 目录的路径。
  inbox_path: D:/path/to/framework/local/projects/example-project/requirements-inbox
# 除 cg-work 外，登记的文件和目录路径使用绝对路径；URL 与命令除外。
# 项目级产品规划产物。
product:
  # 原项目仓库中的路线图文件；没有时为 null。
  roadmap_path: null
# 项目原型；无原型时保持空列表。
prototypes:
  # 每项包含 id、原型目录 path 和可打开的入口文件 entrypoint。
  paths: []
# 可选的 submission 按项目实际提交工具配置；无专用工具时省略。
# 字段：tool（工具文件）、instructions（说明文件列表）、command（执行命令）、
# defaults（base、remote、scope、verify）和 policies（push、merge、deploy）。

# 项目自有技能的位置。
skills:
  # 技能目录路径列表；没有项目技能时为空。
  paths: []