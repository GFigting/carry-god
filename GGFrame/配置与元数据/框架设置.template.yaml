# 框架设置 — 框架级可配置参数
# 用途：使框架可跨场景复用，个人/团队知识库路径与框架核心文件解耦
#
# ⚠️ 使用方式：
#   1. 复制本文件为 框架设置.yaml
#   2. 按需修改 knowledge 路径配置
#
# Agent 读取此文件获取路径配置，向对应目录写入知识沉淀内容。

# ── Git 更新配置 ──
git:
  # 框架 Git 远程地址，Agent 在 Teacher 模式下可据此检查并拉取框架更新。
  # git pull 不会覆盖 .gitignore 中排除的个人文件（项目注册表/框架设置/MCP配置/Goal/Task等）。
  update_url: "https://github.com/Caleb07301/GGFrame.git"

# ── 知识库配置 ──
knowledge:
  # 结构化知识的实际存储根路径。
  # Agent 整理信息、归档知识时写入此路径下的对应子目录（最佳实践/、技术文档/、经验教训/ 等）。
  # 为空字符串时，默认使用框架内 知识沉淀/ 作为存储路径。
  # 示例：D:/MyKnowledge/ 或 /home/user/kb/
  root_path: "知识沉淀/"

  # 收件箱路径 — 人类随手扔未整理信息的入口。
  # Agent 处理收件箱时从此路径读取原始信息，整理后归档到 root_path 对应子目录。
  inbox: "知识沉淀/未处理信息"

  # 已处理信息归档路径 — 收件箱信息被 Agent 整理后，原始信息移动到此路径。
  processed: "知识沉淀/已处理信息"
