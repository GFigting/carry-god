<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG Harness 工作台</title>
<style>
:root{font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2933;background:#eef1f4;--ink:#17212b;--blue:#2563a6;--line:#dbe2e8;--soft:#f6f8fa;--green:#2f7d57;--amber:#a96b19;--red:#a44242}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{height:64px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 2px 10px #17212b22}header strong{font-size:18px;letter-spacing:.2px}header strong:before{content:"CG";display:inline-grid;place-items:center;width:29px;height:29px;margin-right:10px;border:1px solid #91b5d6;border-radius:7px;color:#d7ebff;font-size:11px;letter-spacing:0}.muted{color:#70808d}.light{color:#c8d4df}main{max-width:1480px;margin:auto;padding:24px;display:grid;grid-template-columns:326px 1fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:19px;box-shadow:0 5px 18px #17212b0b}.stack{display:grid;align-content:start;gap:18px}h2,h3{margin:0 0 13px}h2{font-size:22px;line-height:1.25}h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#536574}.stack section{padding-bottom:17px;border-bottom:1px solid #edf1f4}.stack section:last-child{border-bottom:0;padding-bottom:0}.task{padding:13px 12px;border-bottom:1px solid #edf0f2;border-radius:7px;cursor:pointer;transition:.15s}.task:hover{background:#f3f7fb}.task.active{background:#edf5ff;box-shadow:inset 3px 0 var(--blue)}.task strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}.badge{display:inline-block;font-size:11px;font-weight:650;padding:3px 8px;border-radius:999px;background:#edf2f6;color:#4f5d68}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}input,select,textarea,button{font:inherit;border:1px solid #cbd5de;border-radius:6px;padding:9px 10px;background:#fff;color:#26333e}input:focus,select:focus,textarea:focus{outline:2px solid #b9d7f2;border-color:#5791c7}textarea{width:100%;min-height:92px;resize:vertical}button{cursor:pointer;transition:.15s}button:hover{border-color:#8ca9bf;background:#f5f8fa}button.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:650}button.primary:hover{background:#1e568f}.tabs{display:flex;gap:23px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow:auto}.tab{padding:11px 1px 12px;cursor:pointer;color:#6b7a86;white-space:nowrap}.tab.on{color:var(--blue);font-weight:700;border-bottom:2px solid var(--blue)}.card{border:1px solid var(--line);border-radius:8px;padding:17px;margin-bottom:14px;background:#fff}.section{margin-top:17px}.item{padding:12px 0;border-bottom:1px solid #edf0f2}.item:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:6px;margin-bottom:11px;color:#586875;font-size:12px;font-weight:650}.empty{padding:30px 0;text-align:center;color:#8996a0}.danger{color:var(--red)}#tasks{padding:5px;background:var(--soft)}#filter{background:var(--soft)}@media(max-width:820px){header{padding:0 16px}header .light{max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{grid-template-columns:1fr;padding:14px;gap:14px}.panel{padding:15px}.grid{grid-template-columns:1fr}.tabs{gap:17px}}
</style></head>
<body><header><strong>CG Harness 工作台</strong><span class="light" id="project">未初始化项目</span></header>
<main><aside class="panel stack"><section><h3>需求收件箱</h3><textarea id="request" placeholder="输入自然语言需求，例如：修复订单页面保存后金额未更新"></textarea><button class="primary" onclick="intake()">接入需求</button></section><section><h3>项目</h3><div class="row"><input class="grow" id="projectPath" placeholder="项目路径"><button onclick="initProject()">初始化</button></div></section><section><div class="row"><h3 class="grow">任务</h3><span class="badge" id="count">0</span></div><input id="filter" class="grow" placeholder="筛选任务" oninput="loadTasks()"><div id="tasks" class="card">加载中...</div></section></aside>
<section class="panel"><div id="detail"><div class="empty">从左侧选择任务，或先接入一个需求</div></div></section></main>
<script>
let selected=null,current=null,tab='overview';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||(d.errors||[]).join('\n'));return d}
async function loadProject(){try{const d=await api('/api/project');if(d.project){$('#project').textContent=d.project.project.name+' · '+(d.project.project.tech_stack||[]).join('、')}}catch{} }
async function initProject(){try{const d=await api('/api/project/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:$('#projectPath').value||'.'})});$('#project').textContent=d.project.name+' · '+(d.project.tech_stack||[]).join('、');alert('项目初始化完成')}catch(e){alert(e.message)}}
async function intake(){const text=$('#request').value.trim();if(!text)return;try{const t=await api('/api/intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});selected=t.id;$('#request').value='';await loadTasks()}catch(e){alert(e.message)}}
async function loadTasks(){const d=await api('/api/tasks'),q=$('#filter').value.trim().toLowerCase();const tasks=d.tasks.filter(t=>!q||`${t.id} ${t.title} ${t.type} ${t.status}`.toLowerCase().includes(q));$('#count').textContent=tasks.length;$('#tasks').innerHTML=tasks.map(t=>`<div class="task ${t.id===selected?'active':''}" onclick="selectTask('${t.id}')"><strong>${esc(t.title)}</strong><br><span class="muted">${t.id} · ${t.type} · ${t.status}</span></div>`).join('')||'<div class="empty">暂无任务</div>';if(selected){try{await render(await api('/api/tasks/'+selected))}catch{selected=null}}}
async function selectTask(id){selected=id;tab='overview';await loadTasks()}async function render(t){current=t;const tabs=[['overview','概览'],['acceptance','验收与证据'],['plan','计划步骤'],['relations','子任务与依赖'],['log','事件日志']];$('#detail').innerHTML=`<div class="row"><div class="grow"><h2>${esc(t.title)}</h2><p class="muted">${t.id} · <span class="badge">${t.type}</span> · 置信度 ${t.confidence||'-'} · 下一步：${esc(t.next_action)}</p></div><button onclick="saveLearn()">记录经验</button></div><div class="tabs">${tabs.map(x=>`<span class="tab ${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render(current)">${x[1]}</span>`).join('')}</div><div id="body"></div>`;const b=$('#body');if(tab==='overview')overview(b,t);if(tab==='acceptance')acceptance(b,t);if(tab==='plan')plan(b,t);if(tab==='relations')relations(b,t);if(tab==='log')log(b,t)}
function overview(b,t){b.innerHTML=`<div class="row"><select id="to">${['draft','ready','in_progress','under_review','blocked','revision','done','archived','cancelled'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><input id="reason" class="grow" placeholder="状态变更原因"><button class="primary" onclick="transition()">流转状态</button></div><div class="grid section"><div class="card"><h3>任务信息</h3><label>需求意图<textarea id="f-intent">${esc(t.intent)}</textarea></label><div class="grid"><label>项目<input id="f-project" value="${esc(t.project)}"></label><label>负责人<input id="f-owner" value="${esc(t.owner)}"></label></div><label>目标<input id="f-goal" value="${esc(t.goal)}"></label><button onclick="saveMeta()">保存任务信息</button></div><div class="card"><h3>范围与风险</h3><label>包含范围<input id="f-include" value="${esc((t.scope?.include||[]).join('、'))}" placeholder="src、tests"></label><label>排除范围<input id="f-exclude" value="${esc((t.scope?.exclude||[]).join('、'))}"></label><label>风险<input id="f-risk" value="${esc((t.risks||[]).join('、'))}"></label><label>阻塞原因<input id="f-blocker" value="${esc(t.blocker)}"></label><button onclick="saveMeta()">保存范围与风险</button></div></div><div class="card"><h3>任务元数据</h3><div class="grid"><div>上下文：${esc(t.context_package)||'未生成'}</div><div>验收标准：${(t.acceptance||[]).length} 条</div><div>输出物：${(t.outputs||[]).length} 项</div><div>剩余风险：${t.residual_risk_declared?'已声明':'未声明'}</div></div></div>`}
function acceptance(b,t){b.innerHTML=`<div class="card"><h3>验收标准</h3>${(t.acceptance||[]).map(a=>`<div class="item"><strong>${esc(a.id)}</strong>：${esc(a.text)}</div>`).join('')||'<div class="empty">暂无验收标准</div>'}<div class="row"><input id="aid" placeholder="编号"><input id="atext" class="grow" placeholder="验收内容"><button onclick="addAcceptance()">添加</button></div></div><div class="card"><h3>证据</h3>${(t.evidence||[]).map(e=>`<div class="item">${esc(e.kind)} · ${esc(e.acceptance)} · <span class="badge">${esc(e.result)}</span> · ${esc(e.command||e.path)}</div>`).join('')||'<div class="empty">暂无证据</div>'}<div class="row"><input id="ekind" placeholder="类型"><input id="eacc" placeholder="验收编号"><input id="eresult" placeholder="结果"><input id="esource" class="grow" placeholder="命令或来源"><button onclick="addEvidence()">登记</button></div></div>`}
function plan(b,t){b.innerHTML=`<div class="card"><h3>计划步骤</h3>${(t.plan_steps||[]).map(s=>`<div class="item row"><span class="grow"><strong>${esc(s.id)}</strong> ${esc(s.text)} <span class="muted">· ${s.status}</span></span>${s.status==='pending'?`<button onclick="step('${s.id}','start')">开始</button>`:s.status==='in_progress'?`<button onclick="step('${s.id}','done')">完成</button>`:''}</div>`).join('')||'<div class="empty">暂无计划步骤</div>'}<div class="row"><input id="planSteps" class="grow" placeholder="新增步骤，多个步骤用换行分隔"><button onclick="addPlan()">添加步骤</button></div></div>`}
function relations(b,t){b.innerHTML=`<div class="grid"><div class="card"><h3>子任务</h3>${(t.subtasks||[]).map(id=>`<div class="item">${esc(id)}</div>`).join('')||'<div class="empty">暂无子任务</div>'}<div class="row"><input id="subId" placeholder="任务编号"><input id="subTitle" class="grow" placeholder="子任务标题"><button onclick="addSubtask()">创建</button></div></div><div class="card"><h3>依赖</h3>${(t.dependencies||[]).map(id=>`<div class="item">${esc(id)}</div>`).join('')||'<div class="empty">暂无依赖</div>'}<div class="row"><input id="depId" class="grow" placeholder="依赖任务编号"><button onclick="addDependency()">添加依赖</button></div></div></div>`}
async function log(b,t){const d=await api('/api/tasks/'+t.id+'/events');b.innerHTML=`<div class="card"><h3>事件日志</h3>${d.events.slice().reverse().map(e=>`<div class="item"><strong>${esc(e.event)}</strong><br><span class="muted">${esc(e.timestamp)} · ${esc(e.actor)}</span></div>`).join('')}</div>`}
async function transition(){try{await api('/api/tasks/'+selected+'/transition',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:$('#to').value,reason:$('#reason').value})});await loadTasks()}catch(e){alert(e.message)}}async function step(id,action){try{await api('/api/tasks/'+selected+'/step',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});await loadTasks()}catch(e){alert(e.message)}}async function addAcceptance(){try{await api('/api/tasks/'+selected+'/acceptance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('#aid').value,text:$('#atext').value})});await loadTasks()}catch(e){alert(e.message)}}async function addEvidence(){try{await api('/api/tasks/'+selected+'/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:$('#ekind').value,acceptance:$('#eacc').value,result:$('#eresult').value,source:$('#esource').value})});await loadTasks()}catch(e){alert(e.message)}}async function saveLearn(){const text=prompt('请输入要沉淀的经验');if(!text)return;try{await api('/api/tasks/'+selected+'/learn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});alert('已记录')}catch(e){alert(e.message)}}loadProject();loadTasks();setInterval(loadTasks,5000);
async function saveMeta(){const split=s=>s.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);try{await api('/api/tasks/'+selected+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({intent:$('#f-intent').value,project:$('#f-project').value,owner:$('#f-owner').value,goal:$('#f-goal').value,include:split($('#f-include').value),exclude:split($('#f-exclude').value),risk:split($('#f-risk').value),blocker:$('#f-blocker').value})});await loadTasks();alert('任务信息已保存')}catch(e){alert(e.message)}}
async function addPlan(){const steps=$('#planSteps').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!steps.length)return;try{await api('/api/tasks/'+selected+'/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steps})});await loadTasks()}catch(e){alert(e.message)}}
async function addSubtask(){if(!$('#subId').value||!$('#subTitle').value)return;try{await api('/api/tasks/'+selected+'/subtask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('#subId').value,title:$('#subTitle').value})});await loadTasks()}catch(e){alert(e.message)}}
async function addDependency(){const id=$('#depId').value.trim();if(!id)return;try{await api('/api/tasks/'+selected+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dependency:id})});await loadTasks()}catch(e){alert(e.message)}}loadProject();loadTasks();setInterval(loadTasks,5000);
</script></body></html>
