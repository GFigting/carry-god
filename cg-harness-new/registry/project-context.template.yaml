version: 1
description: 框架项目背景与关联入口模板；只登记定位、加载和按需运行信息，业务文档在项目自身 docs/ 维护
projects:
  项目标识:
    display_name: 项目名称
    domain: 项目业务领域
    background: 项目背景、边界和框架内的关联说明
    path: D:/绝对路径/项目根目录
    business_docs:
      - D:/绝对路径/项目根目录/docs/README.md
    required_context:
      - scope: 项目代码变更范围
        trigger: 描述触发条件，例如修改前端代码或后端接口
        documents:
          - D:/绝对路径/项目根目录/docs/README.md
    # 按需添加：repositories（多仓库）、runtime（启动或健康检测）、
    # integrations（外部服务、数据库或接口）和 operations（部署、观测或回滚）。
