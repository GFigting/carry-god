version: 1
description: 框架项目背景与关联入口模板；业务文档在项目自身 docs/ 维护
projects:
  项目标识:
    display_name: 项目名称
    domain: 项目业务领域
    background: 项目背景、边界和框架内的关联说明
    path: D:/绝对路径/项目根目录
    runtime:
      frontend:
        entrypoints:
          - name: 前端开发服务
            command: pnpm run dev
            working_directory: D:/绝对路径/前端项目目录
            url: http://127.0.0.1:5173
            health_path: /
            prerequisites: []
      backend:
        entrypoints:
          - name: 后端服务启动
            kind: spring-boot
            command: mvn spring-boot:run
            working_directory: D:/绝对路径/后端项目目录
            main_class: com.example.Application
            prerequisites: []
        health_checks:
          - name: 后端就绪检查
            kind: readiness
            url: http://127.0.0.1:8080/actuator/health
            method: GET
            authentication: none
            expected_status: 200
            expected_body: UP
            prerequisites: []
    business_docs:
      - D:/绝对路径/项目根目录/docs/README.md
    required_context:
      - scope: 项目代码变更范围
        trigger: 描述触发条件，例如修改前端代码或后端接口
        documents:
          - D:/绝对路径/项目根目录/docs/README.md
