<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root { --blue:#1677ff; --navy:#001529; --line:#e7ebf0; --muted:#7b8796; --text:#1f2937; --bg:#f5f7fb; --green:#16845b; --amber:#b77912; --red:#c53b31; }
    * { box-sizing:border-box; } body { margin:0; min-width:1160px; background:var(--bg); color:var(--text); font:14px/1.45 "Microsoft YaHei","PingFang SC",sans-serif; }

    .sidebar { background:var(--navy); color:#c9d3df; position:sticky; top:0; height:100vh; } .brand { height:58px; display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid rgba(255,255,255,.09); color:#fff; font-size:16px; font-weight:600; }
    .brand-mark { display:grid; width:25px; height:25px; place-items:center; border-radius:5px; background:var(--blue); font-size:13px; }.nav-label { padding:22px 18px 6px; color:#6f849b; font-size:12px; }.nav button { display:flex; width:100%; align-items:center; gap:10px; height:42px; border:0; border-right:3px solid transparent; padding:0 18px; background:transparent; color:#b7c5d4; text-align:left; }.nav button:hover,.nav button.active { background:#123458; border-right-color:#42c99a; color:#fff; }.nav button[disabled] { cursor:default; opacity:.52; }.nav button[disabled]:hover { background:transparent; border-right-color:transparent; color:#b7c5d4; }.nav-icon { width:16px; text-align:center; color:#77aeed; }
    .main { min-width:0; }.topbar { display:flex; align-items:center; justify-content:space-between; height:58px; padding:0 24px; border-bottom:1px solid var(--line); background:#fff; color:#667085; }.crumb strong { color:#273444; }.sync { display:flex; align-items:center; gap:8px; font-size:13px; }.dot { width:7px; height:7px; border-radius:99px; background:#22a06b; }.content { max-width:1660px; margin:0 auto; padding:22px 24px 42px; }
    .page-head { display:flex; justify-content:space-between; gap:24px; align-items:flex-start; margin-bottom:18px; }.eyebrow { margin-bottom:5px; color:var(--blue); font-size:11px; font-weight:700; letter-spacing:.12em; }.page-head h1 { margin:0; font-size:22px; letter-spacing:0; }.page-head p { margin:5px 0 0; color:var(--muted); }.actions { display:flex; gap:8px; }.btn { height:34px; padding:0 13px; border:1px solid #d6dce5; border-radius:4px; background:#fff; color:#425466; }.btn:hover { border-color:var(--blue); color:var(--blue); }.btn.primary { border-color:var(--blue); background:var(--blue); color:#fff; }.btn.danger { border-color:#f3b7b3; background:#fff5f4; color:var(--red); }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }.metric { min-height:98px; padding:15px 16px; border:1px solid var(--line); border-radius:6px; background:#fff; box-shadow:0 2px 7px rgba(14,30,52,.035); }.metric span { color:var(--muted); font-size:12px; }.metric b { display:block; margin-top:9px; font-size:26px; line-height:1; }.metric small { display:block; margin-top:8px; color:#96a0af; }.metric.alert b { color:var(--red); }.metric.warn b { color:var(--amber); }
    .card { margin-bottom:16px; border:1px solid var(--line); border-radius:6px; background:#fff; box-shadow:0 2px 7px rgba(14,30,52,.035); }.card-title { display:flex; align-items:center; justify-content:space-between; min-height:50px; padding:0 16px; border-bottom:1px solid #edf0f4; font-weight:600; }.card-title small { color:var(--muted); font-weight:400; }.filter { display:flex; align-items:end; flex-wrap:wrap; gap:12px; padding:14px 16px; border-bottom:1px solid #edf0f4; }.field { display:grid; gap:5px; }.field label { color:#667085; font-size:12px; }.field input,.field select { width:164px; height:33px; padding:0 9px; border:1px solid #d7dde5; border-radius:4px; background:#fff; color:#364152; }.field input:focus,.field select:focus { outline:2px solid #d8e9ff; border-color:var(--blue); }.field.wide input { width:220px; }
    table { width:100%; border-collapse:collapse; } th,td { height:48px; padding:0 13px; border-bottom:1px solid #edf0f4; white-space:nowrap; text-align:left; } th { height:42px; background:#fafbfc; color:#5d6b7c; font-size:12px; font-weight:600; } tbody tr:hover { background:#f4f9ff; }.link { border:0; padding:0; background:transparent; color:var(--blue); }.link + .link { margin-left:12px; }.tag { display:inline-flex; align-items:center; height:24px; padding:0 8px; border:1px solid transparent; border-radius:4px; font-size:12px; }.tag.blue { color:#1554ad; background:#edf5ff; border-color:#b8d8ff; }.tag.green { color:#166b44; background:#effbf4; border-color:#bce8cd; }.tag.amber { color:#985e05; background:#fffae6; border-color:#f6df88; }.tag.red { color:#a62b23; background:#fff1f0; border-color:#f3bbb7; }.tag.gray { color:#667085; background:#f3f5f7; border-color:#dce1e7; }
    .steps { display:grid; grid-template-columns:repeat(5,1fr); gap:0; padding:18px 20px; }.step { position:relative; padding:0 16px 0 36px; min-height:64px; }.step:not(:last-child)::after { position:absolute; top:13px; right:-10px; left:27px; height:1px; background:#c9d7e8; content:""; }.step i { position:absolute; z-index:1; top:0; left:0; display:grid; width:27px; height:27px; place-items:center; border-radius:50%; background:#eaf3ff; color:#287be7; font-style:normal; font-weight:700; }.step.active i { background:var(--blue); color:#fff; }.step b { display:block; font-size:13px; }.step span { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .tabs { display:flex; gap:2px; padding:0 16px; border-bottom:1px solid #edf0f4; }.tabs button { height:43px; border:0; border-bottom:2px solid transparent; padding:0 14px; background:transparent; color:#667085; }.tabs button.active { border-color:var(--blue); color:var(--blue); font-weight:600; }.callout { display:flex; gap:10px; align-items:center; margin:14px 16px; padding:11px 12px; border:1px solid #d8e9ff; border-radius:4px; background:#f5faff; color:#496173; }.callout strong { color:#2167bd; }
    .drawer { position:fixed; z-index:10; top:0; right:0; display:none; width:720px; height:100vh; border-left:1px solid #dce2e9; background:#fff; box-shadow:-12px 0 28px rgba(18,38,63,.14); }.drawer.show { display:block; }.drawer-head { display:flex; justify-content:space-between; align-items:center; height:62px; padding:0 20px; border-bottom:1px solid var(--line); }.drawer-head h2 { margin:0; font-size:17px; }.close { border:0; background:transparent; color:#8b95a4; font-size:22px; }.drawer-body { height:calc(100vh - 62px); overflow:auto; padding:18px 20px 32px; }.detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0; border-top:1px solid var(--line); border-left:1px solid var(--line); }.detail-grid div { min-height:67px; padding:10px 12px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }.detail-grid span { display:block; color:var(--muted); font-size:12px; }.detail-grid b { display:block; margin-top:6px; font-weight:500; }.drawer-section { margin-top:20px; }.drawer-section h3 { margin:0 0 10px; font-size:14px; }.record { display:grid; grid-template-columns:120px 1fr auto; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid #edf0f4; }.record small { display:block; margin-top:3px; color:var(--muted); }.mask { position:fixed; z-index:9; inset:0; display:none; background:rgba(0,21,41,.2); }.mask.show { display:block; }.empty { padding:34px; color:var(--muted); text-align:center; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar"><div class="brand"><span class="brand-mark">税</span>磐石-财务</div><nav class="nav">
      <div class="nav-label">海外税务管理</div>
      <button class="active" data-page="registration"><span class="nav-icon">□</span>注册管理</button>
      <button disabled><span class="nav-icon">#</span>VAT 管理</button>

    </nav></aside>
    <main class="main"><div class="topbar"><div class="crumb">财务管理系统 / <strong id="crumb">注册管理</strong></div><div class="sync"><span class="dot"></span>领星同步正常　当前用户：海外税务专员</div></div><div class="content" id="app"></div></main>
  </div>
  <div class="mask" id="mask"></div><aside class="drawer" id="drawer"><div class="drawer-head"><h2 id="drawerTitle">详情</h2><button class="close" id="close">×</button></div><div class="drawer-body" id="drawerBody"></div></aside>
  <script>
    const pages = {
      registration: { title:'注册管理', sub:'管理 VAT、EPR / PPWR、包装法、授权代表等注册申请和办理进度。', action:'新增注册申请', metrics:[['待审批','8','其中 3 项资料待补齐','warn'],['办理中','14','服务商正在处理'],['本月完成','26','已转入合规资产'],['超时关注','3','超过目标办理周期','alert']], steps:['提交申请','资料补齐','内部审批','服务商办理','资产建档'], columns:['申请编号','注册类型','主体','国家/地区','关联店铺','服务商','办理状态','负责人','更新时间'], rows:[['REG-202606-001','VAT','厦门拉森贸易','西班牙','Amazon ES-01','美鸥','待审批','惠容','2026-06-02'],['REG-202606-002','包装法','厦门狼耀科技','德国','Amazon DE-03','欧税通','办理中','陈露','2026-06-01'],['REG-202605-021','授权代表','厦门狼腾贸易','欧盟','EU-Multi-02','EPR Partner','已完成','惠容','2026-05-28']], tags:['amber','blue','green'] },
      vat: { title:'VAT 管理', sub:'维护 VAT 税号、法人主体、申报周期、地址核对和服务期资料。', action:'新增 VAT 税号', metrics:[['有效税号','42','覆盖 8 个国家'],['90 天内到期','6','优先准备续费','warn'],['地址待核对','4','需补充核对结论','warn'],['注销处理中','2','等待服务商回执','alert']], columns:['服务商','公司名称','法人','VAT 税号','国家/地区','VAT 申报周期','B2B 申报周期','税号状态','服务到期日','续费倒计时','地址核对'], rows:[['美鸥','厦门拉森贸易','林森','DE123456789','德国','月报','季度报','正常','2026-09-20','4 个月','待核对'],['欧税通','厦门非寻贸易','周非','GB987654321','英国','季度报','年报','正常','2026-07-18','2 个月','有差异'],['沙之星','厦门狼森供应链','陈森','FR556677889','法国','月报','月报','注销中','2026-06-26','22 天','已核对']], tags:['green','green','blue'] },
      epr: { title:'EPR / PPWR 管理', sub:'按合规类型查看注册号、覆盖品类、关联店铺和服务期。', action:'新增合规档案', metrics:[['有效登记','37','EPR、PPWR 与包装法'],['待补充证书','5','服务商资料未归档','warn'],['即将到期','7','90 天内到期','warn'],['关联店铺','128','有效店铺绑定']], columns:['服务商','主体','合规类型','注册号','国家/地区','覆盖品类 / 套餐','关联店铺','服务到期日','倒计时','证书状态'], rows:[['欧税通','厦门狼耀科技','包装法','DE-LUCID-9088','德国','包装法基础套餐','Amazon DE-03','2026-06-30','26 天','待补充'],['EPR Partner','厦门拉森贸易','WEEE','FR-WEEE-2201','法国','电子电器品类','Amazon FR-01','2026-10-10','4 个月','已归档'],['美鸥','厦门非寻贸易','电池法','GB-BAT-1903','英国','电池与配件','Amazon UK-02','2026-08-08','2 个月','已归档']], tags:['amber','green','green'] },
      representative: { title:'授权代表管理', sub:'以协议为主线，维护代表机构、适用地区、地址核对与店铺绑定。', action:'新增授权代表', metrics:[['有效协议','18','覆盖 EU / UK 市场'],['协议待续签','3','90 天内到期','warn'],['地址有差异','2','已标记待确认','warn'],['未绑定店铺','4','需要业务确认','alert']], columns:['代表机构','代表类型','主体','适用地区','协议编号','协议状态','关联店铺','服务到期日','续费倒计时','地址核对'], rows:[['EU Compliance GmbH','欧盟授权代表','厦门拉森贸易','欧盟','EU-AR-2025-038','有效','12','2026-08-01','2 个月','一致'],['UK Responsible Ltd','英国责任人','厦门非寻贸易','英国','UK-RP-2025-112','有效','8','2026-07-10','36 天','有差异'],['FR Representative','法国代表','厦门狼森供应链','法国','FR-AR-2025-021','终止中','2','2026-06-26','22 天','已核对']], tags:['green','green','blue'] },
      renewal: { title:'续费与注销管理', sub:'围绕到期资产生成办理工单；续费、变更、注销均从工单清单发起。', action:'刷新到期提醒', metrics:[['待发起','9','待业务确认处理方式','alert'],['审批中','4','等待内部审批'],['执行中','6','服务商正在办理','warn'],['本月完成','17','已更新资产有效期']], columns:['工单编号','操作类型','关联资产','主体','服务截止','审批状态','执行状态','归档附件','负责人','操作'], rows:[['REN-202606-001','续费','DE-LUCID-9088','厦门狼耀科技','2026-06-30','待审批','待执行','服务协议待上传','陈露',''],['CAN-202606-002','注销','FR556677889','厦门狼森供应链','2026-06-26','已审批','注销中','注销受理回执.pdf','惠容',''],['REN-202606-003','续费','UK-RP-2025-112','厦门非寻贸易','2026-07-10','审批中','待执行','申请附件.pdf','王岚','']], tags:['amber','blue','amber'] }
    };
    const tag = (text, cls='blue') => `<span class="tag ${cls}">${text}</span>`;
    function detail(page, row) { const name = row[0]; return `<div class="callout"><strong>流程定位</strong><span>${page==='registration' ? '注册申请完成后，才可生成合规资产档案。' : page==='renewal' ? '本工单由资产到期提醒生成，执行结果会回写到资产历史。' : '资产详情按基础信息、附件、关联店铺与服务历史分区维护。'}</span></div><div class="detail-grid"><div><span>档案编号</span><b>${name}</b></div><div><span>当前状态</span><b>${tag(page==='renewal' ? row[6] : row[row.length-2], page==='renewal'?'blue':'green')}</b></div><div><span>主体</span><b>${page==='vat'?row[1]:page==='epr'?row[1]:page==='representative'?row[2]:row[3]}</b></div><div><span>服务到期日</span><b>${page==='renewal'?row[4]:row[row.length-3]}</b></div></div><section class="drawer-section"><h3>资料与关联信息</h3><div class="record"><div><b>登记证书</b><small>版本 V2</small></div><div>已归档，支持查看与下载</div>${tag('已归档','green')}</div><div class="record"><div><b>关联店铺</b><small>有效绑定</small></div><div>${page==='registration'?'申请完成后建立绑定':'按国家 / 地区匹配店铺'}</div>${tag('已绑定','green')}</div><div class="record"><div><b>服务历史</b><small>最近一次</small></div><div>2026-05-28　操作人：惠容</div><button class="link">查看记录</button></div></section><section class="drawer-section"><h3>操作记录</h3><div class="record"><div>2026-06-02</div><div>已更新办理状态并保留变更留痕</div>${tag('已记录','gray')}</div></section>`; }
    function render(page='registration') { const p=pages[page]; document.getElementById('crumb').textContent=p.title; const table = p.rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${j===p.rows[0].length-1 && page!=='renewal'?v:(j===p.rows[0].length-2 && page!=='renewal'?tag(v,p.tags[i]):v||'<button class="link action" data-row="'+i+'">详情</button>')}</td>`).join('')}<td>${page==='renewal'?`<button class="link action" data-row="${i}">详情</button><button class="link">登记结果</button>`:`<button class="link action" data-row="${i}">查看详情</button><button class="link">修改</button>`}</td></tr>`).join(''); document.getElementById('app').innerHTML=`<header class="page-head"><div><div class="eyebrow">OVERSEAS TAX COMPLIANCE</div><h1>${p.title}</h1><p>${p.sub}</p></div><div class="actions"><button class="btn">导出</button><button class="btn primary">${p.action}</button></div></header>${page==='registration'?`<section class="card"><div class="card-title">注册申请流程<small>申请与资产建档分离，完成办理后再形成资产</small></div><div class="steps">${p.steps.map((s,i)=>`<div class="step ${i<3?'active':''}"><i>${i+1}</i><b>${s}</b><span>${['业务提出需求','补齐申请资料','确认主体与预算','登记服务商结果','转入资产台账'][i]}</span></div>`).join('')}</div></section>`:''}<section class="metrics">${p.metrics.map(m=>`<div class="metric ${m[3]||''}"><span>${m[0]}</span><b>${m[1]}</b><small>${m[2]}</small></div>`).join('')}</section><section class="card"><div class="card-title"><span>${page==='renewal'?'办理工单队列':page==='registration'?'注册申请列表':'合规资产台账'}</span><small>支持按主体、国家、状态与编号筛选</small></div><div class="filter"><div class="field"><label>主体</label><select><option>全部主体</option><option>厦门拉森贸易</option><option>厦门非寻贸易</option></select></div><div class="field"><label>国家 / 地区</label><select><option>全部</option><option>德国</option><option>英国</option><option>法国</option></select></div><div class="field"><label>${page==='renewal'?'操作 / 执行状态':'当前状态'}</label><select><option>全部状态</option><option>办理中</option><option>有效</option><option>待处理</option></select></div><div class="field wide"><label>关键字</label><input placeholder="编号 / 税号 / 协议号"></div><button class="btn primary">查询</button><button class="btn">重置</button></div><table><thead><tr>${p.columns.map(c=>`<th>${c}</th>`).join('')}<th>操作</th></tr></thead><tbody>${table}</tbody></table></section>`; document.querySelectorAll('.action').forEach(b=>b.onclick=()=>openDrawer(p.title,detail(page,p.rows[b.dataset.row]))); }
    function openDrawer(title, body) { document.getElementById('drawerTitle').textContent=title+'详情'; document.getElementById('drawerBody').innerHTML=body; document.getElementById('mask').classList.add('show'); document.getElementById('drawer').classList.add('show'); } function closeDrawer(){ document.getElementById('mask').classList.remove('show');document.getElementById('drawer').classList.remove('show'); }
    document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)}); document.getElementById('mask').onclick=closeDrawer;document.getElementById('close').onclick=closeDrawer;render();
  </script>
</body>
