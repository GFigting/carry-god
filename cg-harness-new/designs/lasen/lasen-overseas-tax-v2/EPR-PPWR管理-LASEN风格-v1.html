    function daysToExpire(row) {
      return dayjs(row.serviceEnd).diff(today, 'day');
    }

    function riskMeta(days) {
      if (days > 90) return { text: `${days} 天`, className: 'risk-normal' };
      if (days >= 60) return { text: `${days} 天`, className: 'risk-light' };
      if (days >= 30) return { text: `${days} 天`, className: 'risk-mid' };
      return { text: days >= 0 ? `${days} 天` : `已过期 ${Math.abs(days)} 天`, className: 'risk-high' };
    }

    function statusTag(status) {
      const map = { '有效': 'success', '即将到期': 'warning', '注销中': 'processing', '已注销': 'default' };
      return <Tag color={map[status] || 'default'}>{status}</Tag>;
    }

    function simpleTag(value) {
      const map = { '已完成': 'success', '已审批': 'success', '已生效': 'success', '已绑定': 'success', '待申报': 'warning', '待补资料': 'warning', '待审批': 'warning', '未提交': 'default', '待确认': 'warning', '已解绑': 'default', '注销中': 'processing' };
      return <Tag color={map[value] || 'blue'}>{value}</Tag>;
    }

    function fileActions(name) {
      if (!name || name === '-' || name === '待上传') return <span>{name || '-'}</span>;
      return <span className="file-actions"><Button type="link" size="small">查看</Button><Button type="link" size="small">下载</Button></span>;
    }

    function countdownMatch(days, filter) {
      if (!filter) return true;
      if (filter === 'gt90') return days > 90;
      if (filter === '60-90') return days >= 60 && days <= 90;
      if (filter === '30-60') return days >= 30 && days < 60;
      if (filter === 'lt30') return days < 30;
      return true;
    }

      const [view, setView] = useState('list');

      const [activeTab, setActiveTab] = useState('base');
      const [editMode, setEditMode] = useState('add');
      const [editOpen, setEditOpen] = useState(false);
      const [importOpen, setImportOpen] = useState(false);
      const [renewOpen, setRenewOpen] = useState(false);
      const [cancelOpen, setCancelOpen] = useState(false);

      const filteredRows = useMemo(() => assetRows.filter(row => {
        const days = daysToExpire(row);
        const textMatch = (value, keyword) => !keyword || String(value).toLowerCase().includes(String(keyword).toLowerCase());
        return textMatch(row.entityName, filters.entityName)
          && textMatch(row.registrationNo, filters.registrationNo)
          && (!filters.assetType || row.assetType === filters.assetType)
          && (!filters.country || row.country === filters.country)
          && (!filters.declarationCycle || row.declarationCycle === filters.declarationCycle)
          && (!filters.assetStatus || row.assetStatus === filters.assetStatus)
          && countdownMatch(days, filters.countdown);
      }), [filters]);

      const openDetail = row => {
        setActiveRow(row);
        setActiveTab('base');
        setView('detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const listColumns = [

        { title: '资产类型', dataIndex: 'assetType', width: 120, ellipsis: true },
        { title: '主体', dataIndex: 'entityName', width: 190, ellipsis: true },
        { title: '国家/地区', dataIndex: 'country', width: 90 },
        { title: '注册号', dataIndex: 'registrationNo', width: 140 },

        { title: '申报周期', dataIndex: 'declarationCycle', width: 96 },

        { title: '续费倒计时', width: 112, render: (_, row) => { const meta = riskMeta(daysToExpire(row)); return <Tag className={meta.className}>{meta.text}</Tag>; } },

      ];

        title,
        dataIndex: index,

                ['国家/地区', activeRow.country], ['注册号', activeRow.registrationNo], ['注册机构', activeRow.registrationOrg],
                ['申报周期', activeRow.declarationCycle], ['服务期开始日', activeRow.serviceStart], ['服务到期日', activeRow.serviceEnd],
                ['资产状态', statusTag(activeRow.assetStatus)], ['负责人', activeRow.owner], ['关联店铺数', `${activeRow.storeCount} 个`],
                ['套餐内容', activeRow.packageContent],
                ['备注', activeRow.remark]
              ].map(([label, value]) => <Descriptions.Item key={label} label={label}>{value}</Descriptions.Item>)}
            </Descriptions>
          )
        },
        {
          key: 'declaration',
          label: '申报明细',
          children: <Table rowKey={(row, index) => `${row[0]}-${row[1]}-${row[4]}-${index}`} size="middle" columns={declarationColumns} dataSource={activeRow.declarations} pagination={false} scroll={{ x: 1600 }} />
        },
        {
          key: 'certificates',
          label: '证书资料',
          children: (
            <div className="cert-grid">
              {Object.entries(activeRow.certificates).map(([type, files]) => (
                <div className="cert-card" key={type}>
                  <div className="cert-title">
                    <span>{type}</span>
                    <Upload beforeUpload={() => { message.success(`已选择${type}资料，保存后归档`); return false; }} showUploadList={false}>
                      <Button size="small">上传</Button>
                    </Upload>
                  </div>
                  {files.length ? files.map(file => (
                    <div className="cert-version" key={file.name}>
                      <div><div className="file-name">{file.name}</div><div className="file-time">上传时间：{file.time}</div></div>
                      {fileActions(file.name)}
                    </div>
                  )) : <span className="muted">暂无存档</span>}
                </div>
              ))}
            </div>
          )
        },
        {
          key: 'stores',
          label: '关联店铺',
          children: (
            <Table
              rowKey={row => `${row[0]}-${row[1]}`}
              pagination={false}
              columns={[
                { title: '平台', dataIndex: 0, width: 110 },
                { title: '店铺名称', dataIndex: 1 },
                { title: '站点', dataIndex: 2, width: 110 },
                { title: '品牌', dataIndex: 3, width: 120 },
                { title: '绑定状态', dataIndex: 4, width: 110, render: simpleTag },
                { title: '备注', dataIndex: 5 },
                { title: '操作', width: 120, render: () => <Space><Button type="link" size="small">查看</Button><Button type="link" size="small">解绑</Button></Space> }
              ]}
              dataSource={activeRow.stores}
            />
          )
        },
        {
          key: 'service',
          label: '续费/注销记录',
          children: (
            <div className="service-panel">
              <div className="service-current">
                <div className="section-tools">
                  <Button type="primary" onClick={() => setRenewOpen(true)}>发起续费</Button>
                  <Button danger onClick={() => setCancelOpen(true)}>发起注销</Button>
                </div>
                <dl>
                  <dt>服务期开始日</dt><dd>{activeRow.serviceStart}</dd>
                  <dt>服务到期日</dt><dd>{activeRow.serviceEnd}</dd>
                  <dt>资产状态</dt><dd>{statusTag(activeRow.assetStatus)}</dd>
                  <dt>续费倒计时</dt><dd><Tag className={activeRisk.className}>{activeRisk.text}</Tag></dd>
                </dl>
              </div>
              <Table
                rowKey={(row, index) => `${row[0]}-${row[5]}-${index}`}
                pagination={false}
                scroll={{ x: 1100 }}
                columns={[
                  '类型', '期限', '申请附件', '证明文件', '操作人', '操作时间', '备注'
                ].map((title, index) => ({ title, dataIndex: index, width: index >= 2 && index <= 3 ? 150 : 120, render: value => index === 2 || index === 3 ? fileActions(value) : value }))}
                dataSource={activeRow.serviceRecords}
              />
            </div>
          )
        },
        {
          key: 'changes',
          label: '变更记录',
          children: (
            <Table
              rowKey={(row, index) => `${row[0]}-${row[4]}-${index}`}
              pagination={false}
              columns={[
                { title: '修改字段', dataIndex: 0 },
                { title: '修改前', dataIndex: 1 },
                { title: '修改后', dataIndex: 2 },
                { title: '修改人', dataIndex: 3, width: 100 },
                { title: '修改时间', dataIndex: 4, width: 160 },
                { title: '生效时间', dataIndex: 5, width: 120 },
                { title: '状态', dataIndex: 6, width: 100, render: simpleTag }
              ]}
              dataSource={activeRow.changeRecords}
            />
          )
        }
      ];

      return (
        <AntApp>
          <div className="asset-page">
            <div className="asset-header">
              <div>
                <div className="asset-title">{view === 'list' ? 'EPR / PPWR 管理' : 'EPR / PPWR 资产详情'}</div>
                <div className="asset-subtitle">{view === 'list' ? '统一维护 EPR、PPWR、包装法等环保合规资产。' : '通过 Tab 分区查看资产主数据、申报、证书、店铺和历史记录。'}</div>
              </div>
              <div className="asset-actions">
                {view === 'detail' ? (
                  <Button onClick={() => setView('list')}>返回列表</Button>
                ) : (
                  <>
                    <Button type="primary" onClick={() => { setActiveRow(assetRows[0]); setEditMode('add'); setEditOpen(true); }}>新增</Button>
                    <Button onClick={() => setImportOpen(true)}>导入</Button>
                    <Button onClick={() => message.success('已生成导出文件：EPR-PPWR资产台账.xlsx')}>导出</Button>
                  </>
                )}
              </div>
            </div>

            {view === 'list' ? (
              <>
                <Card className="filter-card">
                  <Form form={form} layout="vertical" onFinish={setFilters}>
                    <div className="filter-grid">
                      <Form.Item label="主体" name="entityName"><Input allowClear placeholder="输入主体名称" /></Form.Item>
                      <Form.Item label="注册号" name="registrationNo"><Input allowClear placeholder="输入注册号" /></Form.Item>
                      <Form.Item label="资产类型" name="assetType"><Select allowClear options={assetTypeOptions.map(value => ({ value, label: value }))} /></Form.Item>
                      <Form.Item label="国家/地区" name="country"><Select allowClear options={countryOptions.map(value => ({ value, label: value }))} /></Form.Item>
                      <Form.Item label="申报周期" name="declarationCycle"><Select allowClear options={cycleOptions.map(value => ({ value, label: value }))} /></Form.Item>
                      <Form.Item label="资产状态" name="assetStatus"><Select allowClear options={statusOptions.map(value => ({ value, label: value }))} /></Form.Item>
                      <Form.Item label="续费倒计时" name="countdown"><Select allowClear options={countdownOptions} /></Form.Item>
                      <Form.Item label=" " colon={false}>
                        <Space>
                          <Button type="primary" htmlType="submit">查询</Button>
                          <Button onClick={() => { form.resetFields(); setFilters({}); }}>清除筛选</Button>
                        </Space>
                      </Form.Item>
                    </div>
                  </Form>
                </Card>

                <Card className="table-card">
                  <div className="table-toolbar">
                    <div><div className="table-title">EPR / PPWR 资产列表</div><div className="table-hint">共 {filteredRows.length} 条，统一资产台账通过资产类型区分 EPR、PPWR、包装法。</div></div>
                  </div>
                  <Table
                    rowKey="key"
                    size="middle"
                    columns={listColumns}
                    dataSource={filteredRows}
                    pagination={{ pageSize: 8, showSizeChanger: false }}
                    scroll={{ x: 1460 }}
                  />
                </Card>
              </>
            ) : (
              <div className="detail-layout">
                <Card>
                  <div className="summary-grid">
                    <div className="summary-item"><div className="summary-label">主体</div><div className="summary-value">{activeRow.entityName}</div></div>
                    <div className="summary-item"><div className="summary-label">资产类型</div><div className="summary-value">{activeRow.assetType}</div></div>
                    <div className="summary-item"><div className="summary-label">注册号</div><div className="summary-value">{activeRow.registrationNo}</div></div>
                    <div className="summary-item"><div className="summary-label">资产状态</div><div className="summary-value">{statusTag(activeRow.assetStatus)}</div></div>
                    <div className="summary-item"><div className="summary-label">服务到期日</div><div className="summary-value">{activeRow.serviceEnd}</div></div>
                    <div className="summary-item"><div className="summary-label">续费倒计时</div><div className="summary-value"><Tag className={activeRisk.className}>{activeRisk.text}</Tag></div></div>
                  </div>
                </Card>
                <Card className="detail-card">
                  <Tabs activeKey={activeTab} onChange={setActiveTab} items={tabs} />
                </Card>
              </div>
            )}

            <Modal title={editMode === 'add' ? '新增 EPR / PPWR 资产' : `修改资产信息：${activeRow.registrationNo}`} width={900} open={editOpen} onCancel={() => setEditOpen(false)} okText="保存" cancelText="取消" onOk={() => { setEditOpen(false); message.success('已保存资产信息，并生成变更记录'); }}>
              <Form layout="vertical">
                <div className="filter-grid">
                  <Form.Item label="服务商"><Input defaultValue={activeRow.serviceProvider} /></Form.Item>
                  <Form.Item label="资产类型"><Select defaultValue={activeRow.assetType} options={assetTypeOptions.map(value => ({ value, label: value }))} /></Form.Item>
                  <Form.Item label="主体"><Select defaultValue={activeRow.entityName} options={entityOptions.map(value => ({ value, label: value }))} /></Form.Item>
                  <Form.Item label="国家/地区"><Select defaultValue={activeRow.country} options={countryOptions.map(value => ({ value, label: value }))} /></Form.Item>
                  <Form.Item label="注册号"><Input defaultValue={activeRow.registrationNo} /></Form.Item>
                  <Form.Item label="注册机构"><Input defaultValue={activeRow.registrationOrg} /></Form.Item>
                  <Form.Item label="申报周期"><Select defaultValue={activeRow.declarationCycle} options={cycleOptions.map(value => ({ value, label: value }))} /></Form.Item>
                  <Form.Item label="服务开始日"><DatePicker defaultValue={dayjs(activeRow.serviceStart)} style={{ width: '100%' }} /></Form.Item>
                  <Form.Item label="服务到期日"><DatePicker defaultValue={dayjs(activeRow.serviceEnd)} style={{ width: '100%' }} /></Form.Item>
                  <Form.Item label="负责人"><Input defaultValue={activeRow.owner} /></Form.Item>
                </div>
                <Form.Item label="套餐内容"><Input.TextArea rows={3} defaultValue={activeRow.packageContent} placeholder="填写服务商套餐内容、申报范围、资料归档约定等" /></Form.Item>
                <Form.Item label="备注"><Input.TextArea rows={3} defaultValue={activeRow.remark} /></Form.Item>
              </Form>
            </Modal>

            <Modal title="导入 EPR / PPWR 资产" width={680} open={importOpen} onCancel={() => setImportOpen(false)} okText="确认导入" cancelText="取消" onOk={() => { setImportOpen(false); message.success('已完成导入校验，新增 2 条资产记录'); }}>
              <Upload.Dragger multiple={false} beforeUpload={() => false}>
                <p>拖拽或点击上传 EPR / PPWR 资产台账文件</p>
                <p className="muted">支持 .xlsx / .csv，导入后进入待确认状态。</p>
              </Upload.Dragger>
            </Modal>

            <Modal title={`发起续费：${activeRow.registrationNo}`} width={620} open={renewOpen} onCancel={() => setRenewOpen(false)} okText="提交续费" cancelText="取消" onOk={() => { setRenewOpen(false); message.success('已更新服务到期日和续费倒计时'); }}>
              <Form layout="vertical">
                <Form.Item label="续费期限"><Select defaultValue="12个月" options={['6个月', '12个月', '24个月'].map(value => ({ value, label: value }))} /></Form.Item>
                <Form.Item label="续费说明"><Input.TextArea rows={3} placeholder="填写续费原因、服务商反馈或业务备注" /></Form.Item>
                <Form.Item label="上传申请附件"><Upload beforeUpload={() => false}><Button>选择文件</Button></Upload></Form.Item>
              </Form>
            </Modal>

            <Modal title={`发起注销：${activeRow.registrationNo}`} width={620} open={cancelOpen} onCancel={() => setCancelOpen(false)} okText="提交注销" cancelText="取消" onOk={() => { setCancelOpen(false); message.success('审批通过并执行完成后，可登记注销证明并归档'); }}>
              <Form layout="vertical">
                <Form.Item label="注销原因"><Input.TextArea rows={3} placeholder="填写注销原因、业务确认信息或服务商反馈" /></Form.Item>
                <Form.Item label="上传申请附件"><Upload beforeUpload={() => false}><Button>选择文件</Button></Upload></Form.Item>
                <Form.Item label="上传注销证明"><Upload beforeUpload={() => false}><Button>选择文件</Button></Upload></Form.Item>
              </Form>
            </Modal>
          </div>
        </AntApp>
      );
    }

    ReactDOM.createRoot(document.getElementById('epr-root')).render(<EprPage />);
  </script>
</body>
</html>
